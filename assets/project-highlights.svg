<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="205" viewBox="0 0 1200 205" role="img" aria-labelledby="title desc">
  <title id="title">Project results at a glance</title>
  <desc id="desc">ResNet CIFAR-10 test accuracy 92.95 percent; U-Net Oxford-IIIT Pet test IoU 87.52 percent; NumPy MLP MNIST test accuracy 97.47 percent.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233e"/><stop offset="1" stop-color="#20365a"/></linearGradient>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="0" y="0" width="380" height="205" rx="20" fill="url(#card)"/>
      <rect x="0" y="0" width="380" height="6" rx="3" fill="#69d5e5"/>
      <text x="26" y="49" fill="#a9c2e2" font-size="18" font-weight="700" letter-spacing="1">RESNET · CIFAR-10</text>
      <text x="26" y="129" fill="#ffffff" font-size="61" font-weight="700">92.95%</text>
      <text x="27" y="169" fill="#c3d7ea" font-size="20">test accuracy</text>
    </g>
    <g>
      <rect x="410" y="0" width="380" height="205" rx="20" fill="url(#card)"/>
      <rect x="410" y="0" width="380" height="6" rx="3" fill="#aa8dff"/>
      <text x="436" y="49" fill="#a9c2e2" font-size="18" font-weight="700" letter-spacing="1">U-NET · OXFORD PET</text>
      <text x="436" y="129" fill="#ffffff" font-size="61" font-weight="700">87.52%</text>
      <text x="437" y="169" fill="#c3d7ea" font-size="20">test IoU</text>
    </g>
    <g>
      <rect x="820" y="0" width="380" height="205" rx="20" fill="url(#card)"/>
      <rect x="820" y="0" width="380" height="6" rx="3" fill="#77dfb4"/>
      <text x="846" y="49" fill="#a9c2e2" font-size="18" font-weight="700" letter-spacing="1">NUMPY MLP · MNIST</text>
      <text x="846" y="129" fill="#ffffff" font-size="61" font-weight="700">97.47%</text>
      <text x="847" y="169" fill="#c3d7ea" font-size="20">test accuracy</text>
    </g>
  </g>
</svg>
